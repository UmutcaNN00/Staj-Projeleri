<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dahili Hat Rehberi</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --container-bg: #ffffff;
            --text-color: #1d1d1f;
            --secondary-text: #86868b;
            --border-color: #e5e5ea;
            --primary-color: #0071e3;
            --primary-hover: #0077ed;
            --danger-color: #ff3b30;
            --danger-hover: #ff453a;
            --input-bg: #f5f5f7;
            --input-border: #d2d2d7;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.04);
            --card-radius: 20px;
            --input-radius: 12px;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --container-bg: #1c1c1e;
            --text-color: #f5f5f7;
            --secondary-text: #98989d;
            --border-color: #38383a;
            --primary-color: #0a84ff;
            --primary-hover: #409cff;
            --danger-color: #ff453a;
            --danger-hover: #ff5e55;
            --input-bg: #2c2c2e;
            --input-border: #38383a;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            padding: 1.5rem;
            line-height: 1.4;
            font-size: 14px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 95%;
            margin: 0 auto 1.5rem auto;
        }
        
        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .theme-toggle:hover {
            background-color: var(--border-color);
        }

        .container {
            max-width: 95%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--container-bg);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.15rem;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 1rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--secondary-text);
        }
        
        .input-icon-wrapper {
            position: relative;
        }
        
        .input-icon-wrapper svg {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--secondary-text);
            pointer-events: none;
        }

        input, select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--input-border);
            border-radius: var(--input-radius);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            transition: all 0.2s ease;
            outline: none;
        }
        
        .has-icon {
            padding-left: 2.4rem;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            background-color: var(--container-bg);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        [data-theme="dark"] input:focus, [data-theme="dark"] select:focus {
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
        }
        
        input::placeholder {
            color: var(--secondary-text);
            opacity: 0.6;
        }
        
        input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: var(--input-radius);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.4);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-secondary:hover {
            background-color: var(--input-bg);
            border-color: #c7c7cc;
        }
        
        [data-theme="dark"] .btn-secondary:hover {
            border-color: #48484a;
        }
        
        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }
        
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }
        
        .btn-edit {
            background-color: var(--primary-color);
            color: white;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        
        .btn-edit:hover {
            background-color: var(--primary-hover);
        }

        .actions-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .bulk-actions {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: rgba(0, 113, 227, 0.1);
            border-radius: 12px;
            margin-bottom: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        [data-theme="dark"] .bulk-actions {
            background-color: rgba(10, 132, 255, 0.15);
        }

        .search-box {
            flex-grow: 1;
            min-width: 200px;
            position: relative;
        }
        
        .search-box svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--secondary-text);
        }

        .search-box input {
            padding-left: 2.2rem;
            border-radius: 20px;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .inline-select {
            padding: 0.5rem 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--container-bg);
            color: var(--text-color);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            width: auto;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            font-weight: 500;
            color: var(--secondary-text);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
            position: relative;
            padding-right: 1.5rem;
        }
        
        th.sortable:hover {
            color: var(--text-color);
        }
        
        th.sortable::after {
            content: "↕";
            opacity: 0.3;
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
        }
        
        th.sortable.asc::after {
            content: "↑";
            opacity: 1;
            color: var(--primary-color);
        }
        
        th.sortable.desc::after {
            content: "↓";
            opacity: 1;
            color: var(--primary-color);
        }

        tr:last-child td {
            border-bottom: none;
        }
        
        tbody tr:hover {
            background-color: rgba(134, 134, 139, 0.05);
        }

        [data-theme="dark"] tbody tr:hover {
            background-color: rgba(134, 134, 139, 0.15);
        }
        
        tbody td:not(:last-child) {
            cursor: pointer;
            position: relative;
        }
        
        tbody td:not(:last-child):hover::after {
            content: "Kopyala";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        tbody td:not(:last-child):hover::after {
            opacity: 1;
        }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            white-space: nowrap;
        }
        
        /* Dynamic Department Badges will use inline styles, but here is a default */
        .badge-default { background-color: rgba(142, 142, 147, 0.2); color: var(--secondary-text); }
        [data-theme="dark"] .badge-default { color: #f5f5f7; }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .name-cell {
            display: flex;
            align-items: center;
        }

        /* Print Styles */
        @media print {
            body { background: white; color: black; padding: 0; }
            .header-actions, .card:first-child, .actions-bar, .bulk-actions, #toast, .btn-edit, .btn-danger, input[type="checkbox"], th:first-child, td:first-child, th:last-child, td:last-child { display: none !important; }
            .container { display: block; max-width: 100%; margin: 0; }
            .card { box-shadow: none; border: none; padding: 0; }
            table { width: 100%; border: 1px solid #ddd; }
            th, td { border: 1px solid #ddd; padding: 8px; }
            .badge { border: 1px solid #666; color: black !important; background: transparent !important; }
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--secondary-text);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .toast.warning {
            background-color: #ff9500;
            color: #fff;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .btn-undo {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }
        
        .btn-undo:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dahili Hat Rehberi</h1>
        <div class="header-actions">
            <button class="btn-secondary" id="printBtn">🖨️ Yazdır / PDF</button>
            <button class="theme-toggle" id="themeToggle" aria-label="Temayı Değiştir">🌙</button>
        </div>
    </div>
    
    <div class="container">
        <div class="card">
            <h2 id="formTitle">Yeni Kayıt Ekle</h2>
            <form id="recordForm">
                <input type="hidden" id="recordId">
                
                <div class="form-group">
                    <label for="name">İsim Soyisim</label>
                    <div class="input-icon-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <input type="text" id="name" class="has-icon" required placeholder="Örn: Ali Yılmaz">
                    </div>
                </div>

                <div class="form-group">
                    <label for="extension">Dahili Hat Numarası</label>
                    <div class="input-icon-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        <input type="text" id="extension" class="has-icon" required placeholder="Örn: 1024" maxlength="5">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="department">Çalıştığı Departman <span style="opacity: 0.5; font-size: 0.75rem;">(İsteğe bağlı)</span></label>
                    <div class="input-icon-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <input type="text" id="department" class="has-icon" placeholder="Örn: IT, Satış, İK">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="company">Çalıştığı Firma <span style="opacity: 0.5; font-size: 0.75rem;">(İsteğe bağlı)</span></label>
                    <div class="input-icon-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        <input type="text" id="company" class="has-icon" placeholder="Örn: Teknoloji A.Ş.">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">E-posta <span style="opacity: 0.5; font-size: 0.75rem;">(İsteğe bağlı)</span></label>
                    <div class="input-icon-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <input type="email" id="email" class="has-icon" placeholder="Örn: ali@sirket.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="tags">İller / Gizli Etiketler <span style="opacity: 0.5; font-size: 0.75rem;">(Arama için)</span></label>
                    <div class="input-icon-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                        <input type="text" id="tags" class="has-icon" placeholder="Örn: Ankara, İzmir, VIP">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" id="submitBtn">Kaydet</button>
                <button type="button" class="btn-secondary hidden" id="cancelBtn" style="width: 100%; margin-top: 0.5rem; justify-content: center;">İptal</button>
            </form>
        </div>

        <div class="card">
            <div id="bulkActions" class="bulk-actions hidden">
                <span id="selectedCountText">0 kayıt seçildi</span>
                <div>
                    <button class="btn-secondary" id="bulkExportBtn" style="background-color: var(--container-bg); margin-right: 0.5rem;">Seçilenleri İndir</button>
                    <button class="btn-danger" id="bulkDeleteBtn">Seçilenleri Sil</button>
                </div>
            </div>

            <div class="actions-bar">
                <div class="search-box">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="searchInput" placeholder="Ara...">
                </div>
                
                <select id="filterDepartment" class="inline-select">
                    <option value="all">Tüm Departmanlar</option>
                    <!-- Dinamik olarak doldurulacak -->
                </select>
                
                <select id="copyMode" class="inline-select">
                    <option value="default">Tıklananı Kopyala</option>
                    <option value="extension">Dahili Kopyala</option>
                    <option value="name">İsim Kopyala</option>
                    <option value="email">E-posta Kopyala</option>
                </select>
                
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">
                        <svg style="width: 16px; height: 16px; margin-right: 0.3rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        İçe Aktar
                    </button>
                    <input type="file" id="fileInput" accept=".csv" class="hidden">
                    
                    <button class="btn-secondary" id="exportBtn">
                        <svg style="width: 16px; height: 16px; margin-right: 0.3rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Tümünü İndir
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table id="recordsTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="selectAll"></th>
                            <th class="sortable" data-sort="name">İsim Soyisim</th>
                            <th class="sortable" data-sort="extension">Dahili Hat</th>
                            <th class="sortable" data-sort="department">Departman</th>
                            <th class="sortable" data-sort="company">Firma</th>
                            <th class="sortable" data-sort="email">E-posta</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Kayıtlar buraya gelecek -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state">
                    Henüz hiçbir kayıt bulunmuyor.
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastMessage">İşlem başarılı!</span>
        <button id="undoBtn" class="btn-undo hidden">Geri Al</button>
    </div>

    <script>
        // DOM Elements
        const form = document.getElementById('recordForm');
        const nameInput = document.getElementById('name');
        const extensionInput = document.getElementById('extension');
        const departmentInput = document.getElementById('department');
        const companyInput = document.getElementById('company');
        const emailInput = document.getElementById('email');
        const tagsInput = document.getElementById('tags');
        const recordIdInput = document.getElementById('recordId');
        
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        const recordsTable = document.getElementById('recordsTable');
        
        const searchInput = document.getElementById('searchInput');
        const filterDepartment = document.getElementById('filterDepartment');
        const exportBtn = document.getElementById('exportBtn');
        const themeToggle = document.getElementById('themeToggle');
        const copyModeSelect = document.getElementById('copyMode');
        
        const sortableHeaders = document.querySelectorAll('.sortable');
        const selectAllCheckbox = document.getElementById('selectAll');
        const bulkActionsDiv = document.getElementById('bulkActions');
        const selectedCountText = document.getElementById('selectedCountText');
        const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
        const bulkExportBtn = document.getElementById('bulkExportBtn');
        const fileInput = document.getElementById('fileInput');

        const undoBtn = document.getElementById('undoBtn');
        const toastMessage = document.getElementById('toastMessage');
        const printBtn = document.getElementById('printBtn');

        // State
        // State
        let records = JSON.parse(localStorage.getItem('dahili_records')) || [];
        let currentSort = { field: 'date', order: 'desc' };

        // Hafıza boşsa GitHub'daki CSV dosyasını çek
        if (records.length === 0) {
    fetch('rehber-test-50.csv')
        .then(response => {
            if (!response.ok) throw new Error('CSV çekilemedi');
            return response.text();
        })
        .then(csvText => {
            processCSV(csvText); // Mevcut CSV işleme fonksiyonun
        })
        .catch(err => console.log('Test verisi yüklenemedi:', err));
} else {
    renderTable();
}

initTheme();
        
        // Undo state
        let deletedRecordsCache = [];
        let undoTimeout = null;
        
        // Initial render
        renderTable();
        initTheme();
        
        // Print
        printBtn.addEventListener('click', () => {
            window.print();
        });

        // Auto Phone Formatting (Now Extension - just limit to numbers)
        extensionInput.addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Theme Handling
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.textContent = '🌙';
            }
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            themeToggle.textContent = newTheme === 'light' ? '🌙' : '☀️';
        });

        // Form Submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const id = recordIdInput.value;
            let existingRecord = records.find(r => r.id === id);
            
            const record = {
                id: id ? id : Date.now().toString(),
                name: nameInput.value.trim(),
                extension: extensionInput.value.trim(),
                department: departmentInput.value.trim(),
                company: companyInput.value.trim(),
                email: emailInput.value.trim(),
                tags: tagsInput.value.trim(),
                date: id && existingRecord ? existingRecord.date : new Date().toISOString()
            };

            if (id) {
                // Update
                const index = records.findIndex(r => r.id === id);
                if (index !== -1) {
                    records[index] = record;
                }
            } else {
                // Add new
                records.unshift(record); // Add to beginning
            }

            saveRecords();
            renderTable();
            resetForm();
        });

        // Cancel Edit
        cancelBtn.addEventListener('click', resetForm);

        // Search & Filter
        searchInput.addEventListener('input', () => {
            renderTable();
        });
        
        filterDepartment.addEventListener('change', () => {
            renderTable();
        });

        // Bulk Actions Logic
        function updateBulkActionsVisibility() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkedBoxes.length > 0) {
                bulkActionsDiv.classList.remove('hidden');
                selectedCountText.textContent = `${checkedBoxes.length} kayıt seçildi`;
            } else {
                bulkActionsDiv.classList.add('hidden');
                selectAllCheckbox.checked = false;
            }
        }

        selectAllCheckbox.addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = e.target.checked;
            });
            updateBulkActionsVisibility();
        });

        tableBody.addEventListener('change', (e) => {
            if (e.target.classList.contains('row-checkbox')) {
                const checkboxes = document.querySelectorAll('.row-checkbox');
                const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
                
                selectAllCheckbox.checked = checkboxes.length === checkedBoxes.length && checkboxes.length > 0;
                updateBulkActionsVisibility();
            }
        });

        // Export to CSV
        function exportToCSV(dataToExport) {
            if (dataToExport.length === 0) {
                alert('İndirilecek kayıt bulunmuyor.');
                return;
            }

            const headers = ['İsim Soyisim', 'Dahili Hat', 'Firma', 'Departman', 'E-posta', 'Etiketler', 'Tarih'];
            const csvRows = [];
            
            csvRows.push(headers.join(';')); // Türkçe Excel uyumluluğu için noktalı virgül
            
            for (const record of dataToExport) {
                const values = [
                    `"${record.name.replace(/"/g, '""')}"`,
                    `"${record.extension.replace(/"/g, '""')}"`,
                    `"${record.company.replace(/"/g, '""')}"`,
                    `"${record.department.replace(/"/g, '""')}"`,
                    `"${record.email.replace(/"/g, '""')}"`,
                    `"${record.tags.replace(/"/g, '""')}"`,
                    `"${new Date(record.date).toLocaleDateString('tr-TR')}"`
                ];
                csvRows.push(values.join(';'));
            }

            const csvString = '\uFEFF' + csvRows.join('\n'); // Add BOM for Excel UTF-8 support
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `kayitlar_${new Date().toLocaleDateString('tr-TR')}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        exportBtn.addEventListener('click', () => {
            exportToCSV(records);
        });
        
        bulkExportBtn.addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const idsToExport = Array.from(checkedBoxes).map(cb => cb.value);
            const dataToExport = records.filter(r => idsToExport.includes(r.id));
            
            exportToCSV(dataToExport);
        });
        
        // CSV Import Logic
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                processCSV(text);
                // Reset file input so same file can be selected again
                fileInput.value = '';
            };
            
            reader.onerror = function() {
                alert('Dosya okunamadı!');
            };

            reader.readAsText(file);
        });

        function processCSV(csvText) {
            // Remove BOM if present
            if (csvText.charCodeAt(0) === 0xFEFF) {
                csvText = csvText.slice(1);
            }

            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) {
                alert('Geçerli bir CSV formatı veya veri bulunamadı.');
                return;
            }

            // Simple CSV parser ignoring semicolons/commas inside quotes
            function parseLine(line) {
                const result = [];
                let cell = '';
                let inQuotes = false;
                
                // Determine delimiter used in the header line (fallback to comma if no semicolon)
                const delimiter = lines[0].includes(';') ? ';' : ',';
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    
                    if (char === '"' && line[i+1] === '"') {
                        cell += '"';
                        i++; // Skip escaped quote
                    } else if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === delimiter && !inQuotes) {
                        result.push(cell);
                        cell = '';
                    } else {
                        cell += char;
                    }
                }
                result.push(cell);
                return result;
            }

            // Validate headers roughly
            const headers = parseLine(lines[0]);
            if (!headers.some(h => h.toLowerCase().includes('isim'))) {
                alert('Geçersiz dosya formatı. Gerekli sütunlar okunamadı. Dosyayı Excel\'de kaydedip tekrar deneyin.');
                return;
            }

            let importCount = 0;
            let skipCount = 0;
            
            for (let i = 1; i < lines.length; i++) {
                const values = parseLine(lines[i]);
                if (values.length < 2) continue; // Skip bad lines

                // Assuming columns: İsim Soyisim, Dahili Hat, Firma, Departman, E-posta, Etiketler, Tarih
                let name = values[0] || '';
                let extension = values[1] || '';
                let company = values[2] || '';
                let department = values[3] || '';
                let email = values[4] || '';
                let tags = values[5] || '';

                // Skip if name is empty (since name and extension are required)
                if (!name.trim() || !extension.trim()) continue;
                
                const cleanedName = name.trim().toLowerCase();

                // Check for duplicates (based on name for internal directory)
                const exists = records.some(r => r.name.toLowerCase() === cleanedName);
                if (exists) {
                    skipCount++;
                    continue;
                }

                records.unshift({
                    id: Date.now().toString() + importCount, // Ensure unique ID during fast loop
                    name: name.trim(),
                    extension: extension.trim(),
                    department: department.trim(),
                    company: company.trim(),
                    email: email.trim(),
                    tags: tags.trim(),
                    date: new Date().toISOString()
                });
                importCount++;
            }

            if (importCount > 0) {
                saveRecords();
                renderTable();
                
                let msg = `${importCount} yeni kayıt içe aktarıldı!`;
                if (skipCount > 0) {
                    msg += ` (${skipCount} mevcut kayıt atlandı)`;
                }
                showToast(msg);
            } else if (skipCount > 0) {
                showToast(`Yeni kayıt bulunamadı. (${skipCount} mevcut kayıt atlandı)`);
            } else {
                alert('İçe aktarılacak geçerli kayıt bulunamadı.');
            }
        }

        // Helper Functions
        function saveRecords() {
            localStorage.setItem('records', JSON.stringify(records));
        }

        // Sorting Logic
        sortableHeaders.forEach(header => {
            header.addEventListener('click', () => {
                const field = header.dataset.sort;
                
                if (currentSort.field === field) {
                    currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.field = field;
                    currentSort.order = 'asc';
                }
                
                // Update UI arrows
                sortableHeaders.forEach(h => {
                    h.classList.remove('asc', 'desc');
                });
                header.classList.add(currentSort.order);
                
                renderTable();
            });
        });

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            // Use softer HSL colors for badges
            const h = Math.abs(hash) % 360;
            return `hsl(${h}, 70%, 45%)`;
        }
        
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function renderTable() {
            tableBody.innerHTML = '';
            
            // Populate Department Filter dynamically
            const departments = [...new Set(records.map(r => r.department).filter(d => d.trim() !== ''))].sort();
            const currentFilter = filterDepartment.value;
            filterDepartment.innerHTML = '<option value="all">Tüm Departmanlar</option>';
            departments.forEach(dep => {
                const opt = document.createElement('option');
                opt.value = dep;
                opt.textContent = dep;
                if (dep === currentFilter) opt.selected = true;
                filterDepartment.appendChild(opt);
            });
            
            const searchTerm = searchInput.value.toLowerCase();
            const selectedFilterDep = filterDepartment.value;
            
            let filteredRecords = records.filter(record => {
                const matchSearch = record.name.toLowerCase().includes(searchTerm) ||
                                  record.email.toLowerCase().includes(searchTerm) ||
                                  record.company.toLowerCase().includes(searchTerm) ||
                                  record.department.toLowerCase().includes(searchTerm) ||
                                  record.extension.toLowerCase().includes(searchTerm) ||
                                  record.tags.toLowerCase().includes(searchTerm);
                                  
                const matchDep = selectedFilterDep === 'all' || record.department === selectedFilterDep;
                
                return matchSearch && matchDep;
            });

            // Apply Sorting
            filteredRecords.sort((a, b) => {
                let valA = a[currentSort.field] || '';
                let valB = b[currentSort.field] || '';
                
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();
                
                if (valA < valB) return currentSort.order === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.order === 'asc' ? 1 : -1;
                return 0;
            });

            if (filteredRecords.length === 0) {
                emptyState.classList.remove('hidden');
                recordsTable.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                recordsTable.classList.remove('hidden');
                
                filteredRecords.forEach(record => {
                    const tr = document.createElement('tr');
                    tr.dataset.id = record.id;
                    
                    const initials = getInitials(record.name);
                    const avatarColor = stringToColor(record.name);
                    
                    let depBadge = '-';
                    if (record.department) {
                        const depColor = stringToColor(record.department);
                        // Using a semi-transparent background with text matching the generated color
                        depBadge = `<span class="badge" style="background-color: ${depColor.replace(')', ', 0.15)').replace('hsl', 'hsla')}; color: ${depColor};">${escapeHtml(record.department)}</span>`;
                    }
                    
                    tr.innerHTML = `
                        <td><input type="checkbox" class="row-checkbox" value="${record.id}"></td>
                        <td data-field="name" class="name-cell">
                            <div class="avatar" style="background-color: ${avatarColor};">${initials}</div>
                            ${escapeHtml(record.name)}
                        </td>
                        <td data-field="extension"><strong>${escapeHtml(record.extension)}</strong></td>
                        <td data-field="department">${depBadge}</td>
                        <td data-field="company">${escapeHtml(record.company) || '-'}</td>
                        <td data-field="email">${escapeHtml(record.email) || '-'}</td>
                        <td style="white-space: nowrap;">
                            <button class="btn-edit" onclick="editRecord('${record.id}')">Düzenle</button>
                            <button class="btn-danger" onclick="deleteRecord('${record.id}')">Sil</button>
                        </td>
                    `;
                    
                    tableBody.appendChild(tr);
                });
            }
            
            // Uncheck "select all" on render
            selectAllCheckbox.checked = false;
            updateBulkActionsVisibility();
        }

        function resetForm() {
            form.reset();
            recordIdInput.value = '';
            formTitle.textContent = 'Yeni Kayıt Ekle';
            submitBtn.textContent = 'Kaydet';
            cancelBtn.classList.add('hidden');
        }

        window.editRecord = function(id) {
            const record = records.find(r => r.id === id);
            if (record) {
                recordIdInput.value = record.id;
                nameInput.value = record.name;
                extensionInput.value = record.extension;
                departmentInput.value = record.department;
                companyInput.value = record.company;
                emailInput.value = record.email;
                tagsInput.value = record.tags;
                
                formTitle.textContent = 'Kaydı Düzenle';
                submitBtn.textContent = 'Güncelle';
                cancelBtn.classList.remove('hidden');
                
                // Scroll to top on mobile
                window.scrollTo({ top: 0, behavior: 'smooth' });
                nameInput.focus();
            }
        };

        window.deleteRecord = function(id) {
            // Find record before deleting
            const recordToDelete = records.find(r => r.id === id);
            if (!recordToDelete) return;

            // Remove from main array
            records = records.filter(r => r.id !== id);
            saveRecords();
            
            // Handle form reset if editing
            if (recordIdInput.value === id) {
                resetForm();
            }
            
            renderTable();

            // Set up undo
            deletedRecordsCache = [recordToDelete];
            showUndoToast('Kayıt silindi.');
        };
        
        // Update bulk delete to also use undo
        bulkDeleteBtn.addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkedBoxes.length === 0) return;
            
            const idsToDelete = Array.from(checkedBoxes).map(cb => cb.value);
            
            // Cache deleted records for undo
            deletedRecordsCache = records.filter(r => idsToDelete.includes(r.id));
            
            // Delete from main array
            records = records.filter(r => !idsToDelete.includes(r.id));
            saveRecords();
            
            // Reset form if needed
            if (idsToDelete.includes(recordIdInput.value)) {
                resetForm();
            }
            
            selectAllCheckbox.checked = false;
            renderTable();
            
            showUndoToast(`${idsToDelete.length} kayıt silindi.`);
        });

        function escapeHtml(unsafe) {
            if (unsafe === undefined || unsafe === null) return '';
            return unsafe.toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Copy Logic & Toast
        let toastTimeout;
        function showToast(message) {
            toastMessage.textContent = message;
            undoBtn.classList.add('hidden');
            toast.classList.remove('warning');
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        function showUndoToast(message) {
            toastMessage.textContent = message;
            undoBtn.classList.remove('hidden');
            toast.classList.add('warning');
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            clearTimeout(undoTimeout);
            
            // Hide toast after 5 seconds
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
                deletedRecordsCache = []; // clear cache after timeout
            }, 5000);
        }
        
        undoBtn.addEventListener('click', () => {
            if (deletedRecordsCache.length > 0) {
                // Restore records
                records.push(...deletedRecordsCache);
                deletedRecordsCache = []; // clear cache
                
                saveRecords();
                renderTable();
                
                // Hide toast
                toast.classList.remove('show');
                clearTimeout(toastTimeout);
                
                // Show success
                setTimeout(() => showToast('Silme işlemi geri alındı!'), 300);
            }
        });

        tableBody.addEventListener('click', (e) => {
            const td = e.target.closest('td');
            // Ignore clicks on checkbox, actions, or if it's not a data field
            if (!td || !td.dataset.field || e.target.tagName.toLowerCase() === 'input') return;

            const tr = td.closest('tr');
            const recordId = tr.dataset.id;
            const record = records.find(r => r.id === recordId);
            
            if (!record) return;

            const mode = copyModeSelect.value;
            let textToCopy = '';

            if (mode === 'default') {
                textToCopy = td.textContent.trim();
            } else {
                textToCopy = record[mode];
            }

            if (textToCopy) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    let fieldName = '';
                    switch (mode) {
                        case 'default': fieldName = 'Bilgi'; break;
                        case 'extension': fieldName = 'Dahili Hat'; break;
                        case 'name': fieldName = 'İsim'; break;
                        case 'email': fieldName = 'E-posta'; break;
                    }
                    showToast(`${fieldName} kopyalandı!`);
                }).catch(err => {
                    console.error('Kopyalama başarısız oldu:', err);
                    showToast('Kopyalama başarısız oldu.');
                });
            }
        });
    </script>
